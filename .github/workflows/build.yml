name: Build

on:
  push:
    branches: [ "fix/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # LibreHardwareMonitorLib 声明了 net8/9/10 目标，还原时需要能识别 net10.0 的 SDK
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore OmenSuperHub.sln

      - name: Build
        run: msbuild OmenSuperHub.csproj /m /p:Configuration=Release /p:Platform=x64 /v:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: OmenSuperHub-x64-Release
          path: bin/x64/Release/
